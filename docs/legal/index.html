<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CoffeeVision</title>
<style>
  :root {
    --bg: #ffffff; --fg: #1c1c1e; --muted: #6b6b70;
    --accent: #7a4a2b; --border: #e5e5ea; --card: #f7f7f8;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1c1c1e; --fg: #f2f2f7; --muted: #9a9aa0;
      --accent: #c8956a; --border: #38383a; --card: #2c2c2e;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 0; background: var(--bg); color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", sans-serif;
    line-height: 1.8; font-size: 16px;
  }
  main { max-width: 760px; margin: 0 auto; padding: 40px 20px 80px; }
  h1 { font-size: 1.75rem; margin: 0 0 0.25em; }
  .meta { color: var(--muted); font-size: 0.9rem; margin-bottom: 2em; }
  a { color: var(--accent); }
  ul.links { list-style: none; padding: 0; margin: 1.5em 0; }
  ul.links li {
    background: var(--card); border-radius: 8px; padding: 16px 20px; margin-bottom: 12px;
  }
  ul.links a { font-weight: 600; text-decoration: none; }
  ul.links p { margin: 0.2em 0 0; color: var(--muted); font-size: 0.9rem; }
  footer { color: var(--muted); font-size: 0.85rem; margin-top: 3em; border-top: 1px solid var(--border); padding-top: 1em; }
</style>
</head>
<body>
<main>
  <h1>CoffeeVision</h1>
  <p class="meta">訪れたカフェでのコーヒー体験を記録・振り返るアプリ</p>

  <ul class="links">
    <li>
      <a href="privacy-policy.html">プライバシーポリシー</a>
      <p>収集する情報と利用目的、第三者サービス、ユーザーの権利について</p>
    </li>
    <li>
      <a href="support.html">サポート</a>
      <p>よくある質問とお問い合わせ先</p>
    </li>
  </ul>

  <footer>
    &copy; 2026 noricoffee
  </footer>
</main>
</body>
</html>
